
name: Castla Signed APK Build

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: castla-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # --------------------------------------------------
      # 1. Checkout source
      # --------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Set up Java
      # --------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Locate Android SDK
      # --------------------------------------------------

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found: $SDK"
            exit 1
          fi

          echo "Android SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=""

          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK/cmdline-tools/15.0/bin/sdkmanager"; do

            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi

          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager \
              -perm /111 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      # --------------------------------------------------
      # 4. Install required Android SDK packages
      # --------------------------------------------------

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android SDK packages..."

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "Android SDK installation completed."

      # --------------------------------------------------
      # 5. Set up Gradle
      # --------------------------------------------------

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          ./gradlew --version

      # --------------------------------------------------
      # 6. Generate version information
      # --------------------------------------------------

      - name: Prepare version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="1.1.0"

          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))

          VERSION_NAME="${BASE_VERSION}-build.${GITHUB_RUN_NUMBER}"

          RELEASE_TAG="v${VERSION_NAME}-run.${GITHUB_RUN_ATTEMPT}"

          echo "CASTLA_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "CASTLA_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo "Version Name: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"
          echo "Release Tag: $RELEASE_TAG"

      # --------------------------------------------------
      # 7. Restore signing keystore
      # --------------------------------------------------

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CASTLA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CASTLA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CASTLA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CASTLA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing CASTLA_KEYSTORE_BASE64"
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing CASTLA_STORE_PASSWORD"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing CASTLA_KEY_ALIAS"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing CASTLA_KEY_PASSWORD"
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/castla-release.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          echo "CASTLA_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Signing keystore restored successfully."

      # --------------------------------------------------
      # 8. Build signed release APK
      # --------------------------------------------------

      - name: Build signed release APK
        shell: bash
        env:
          CASTLA_STORE_PASSWORD: ${{ secrets.CASTLA_STORE_PASSWORD }}
          CASTLA_KEY_ALIAS: ${{ secrets.CASTLA_KEY_ALIAS }}
          CASTLA_KEY_PASSWORD: ${{ secrets.CASTLA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 9. Locate, verify and rename APK
      # --------------------------------------------------

      - name: Verify and rename APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK not found"
            find app/build/outputs -type f || true
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          mkdir -p dist

          OUTPUT_NAME="Castla-v${CASTLA_VERSION_NAME}.apk"

          cp "$APK" "dist/$OUTPUT_NAME"

          (
            cd dist
            sha256sum "$OUTPUT_NAME" > "$OUTPUT_NAME.sha256"
          )

          echo "filename=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"

          echo "Generated APK:"
          ls -lh dist/

      # --------------------------------------------------
      # 10. Upload GitHub Actions artifact
      # --------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Castla-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      # --------------------------------------------------
      # 11. Publish GitHub Release
      # --------------------------------------------------

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" dist/* \
            --target "$COMMIT_SHA" \
            --title "Castla $RELEASE_NAME" \
            --notes "Automated signed APK build.

          Version: $RELEASE_NAME
          Version Code: $VERSION_CODE
          Commit: $COMMIT_SHA

          Signed Release APK with SHA-256 checksum." \
            --prerelease

      # --------------------------------------------------
      # 12. Build summary
      # --------------------------------------------------

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Castla Build Successful"
            echo ""
            echo "- Version: $CASTLA_VERSION_NAME"
            echo "- Version Code: $CASTLA_VERSION_CODE"
            echo "- Signed APK: Yes"
            echo "- Android SDK: 35"
            echo "- Build Tools: 35.0.0"
            echo ""
            echo "Download the APK from GitHub Releases."
          } >> "$GITHUB_STEP_SUMMARY"

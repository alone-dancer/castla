
name: Castla Signed APK Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: castla-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare version
        id: version
        shell: bash
        run: |
          CODE=$((100000 + GITHUB_RUN_NUMBER))
          NAME="1.1.0-build.${GITHUB_RUN_NUMBER}"
          TAG="v${NAME}-run.${GITHUB_RUN_ATTEMPT}"

          echo "CASTLA_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "CASTLA_VERSION_NAME=$NAME" >> "$GITHUB_ENV"

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CASTLA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CASTLA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CASTLA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CASTLA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for value in \
            "$KEYSTORE_BASE64" \
            "$STORE_PASSWORD" \
            "$KEY_ALIAS" \
            "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "Missing signing secret"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/castla.jks"

          echo "CASTLA_KEYSTORE_FILE=$RUNNER_TEMP/castla.jks" >> "$GITHUB_ENV"
          echo "CASTLA_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CASTLA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CASTLA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            --no-daemon --stacktrace

      - name: Verify and rename APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          mkdir -p dist
          NAME="Castla-v${CASTLA_VERSION_NAME}.apk"
          cp "$APK" "dist/$NAME"

          sha256sum "dist/$NAME" > "dist/$NAME.sha256"

          echo "filename=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Castla-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" dist/* \
            --target "$COMMIT_SHA" \
            --title "Castla $RELEASE_NAME" \
            --notes "Automated signed APK build.

          Version: $RELEASE_NAME
          Version code: $VERSION_CODE
          Commit: $COMMIT_SHA

          Includes APK and SHA-256 checksum." \
            --prerelease
